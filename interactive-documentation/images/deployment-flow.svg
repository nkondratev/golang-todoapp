<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" font-family="Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="760" height="170" fill="#fff"/>
<g font-size="12" text-anchor="middle">
<rect x="10" y="40" width="105" height="70" rx="8" fill="#e8f0fe" stroke="#2b5bd7"/><text x="62" y="70" font-weight="bold">1. Подготовка</text><text x="62" y="90">Docker, файлы</text>
<rect x="135" y="40" width="105" height="70" rx="8" fill="#e8f0fe" stroke="#2b5bd7"/><text x="187" y="70" font-weight="bold">2. Резерв</text><text x="187" y="90">копия БД и конфига</text>
<rect x="260" y="40" width="105" height="70" rx="8" fill="#e8f0fe" stroke="#2b5bd7"/><text x="312" y="70" font-weight="bold">3. Установка</text><text x="312" y="90">compose up --build</text>
<rect x="385" y="40" width="105" height="70" rx="8" fill="#e8f0fe" stroke="#2b5bd7"/><text x="437" y="70" font-weight="bold">4. Настройка</text><text x="437" y="90">БД, порт, env</text>
<rect x="510" y="40" width="105" height="70" rx="8" fill="#e8f0fe" stroke="#2b5bd7"/><text x="562" y="70" font-weight="bold">5. Проверка</text><text x="562" y="90">запросы, логи</text>
<rect x="635" y="40" width="115" height="70" rx="8" fill="#e6f4ea" stroke="#2e8b3d"/><text x="692" y="70" font-weight="bold">6. Доступ</text><text x="692" y="90">выдача, фиксация</text>
