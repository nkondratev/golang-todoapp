<g stroke="#555" stroke-width="2" marker-end="url(#a)"><line x1="115" y1="75" x2="133" y2="75"/><line x1="240" y1="75" x2="258" y2="75"/><line x1="365" y1="75" x2="383" y2="75"/><line x1="490" y1="75" x2="508" y2="75"/><line x1="615" y1="75" x2="633" y2="75"/></g>
<text x="380" y="145" text-anchor="middle" font-size="12" fill="#c0392b">При критической ошибке &gt; 30 мин — откат (docker compose down → предыдущая версия)</text>
